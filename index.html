<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Super Brunucho: A Lenda da Aura Infinita</title>
  <meta name="theme-color" content="#12121c">
  <meta name="format-detection" content="telephone=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Super Brunucho">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <script>
    // Safari do iPhone ignora user-scalable=no: bloqueia o zoom de pinça e de toque duplo na mão
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((e) => document.addEventListener(e, (ev) => ev.preventDefault()));
  </script>
  <script>
    // O "app instalável" só funciona quando o jogo está num servidor (http/https); abrindo o arquivo direto, não carrega o manifesto.
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.webmanifest'; document.head.appendChild(l);
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #12121c; overflow: hidden; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* iPhone: o jogo fica longe do notch/ilha e da barrinha de baixo (env = "área segura") */
    #game { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    /* aviso "gire o celular" (aparece só em celular em pé) */
    #girar { display: none; position: fixed; inset: 0; z-index: 10; background: #12121c; color: #fff;
      font-family: "Trebuchet MS", Verdana, sans-serif; text-align: center; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    body.retrato #girar { display: flex; }
    #girar .tel { font-size: 84px; display: inline-block; animation: gira 2.4s ease-in-out infinite; }
    #girar b { font-size: 26px; color: #ffd23f; margin-top: 18px; }
    #girar span { font-size: 17px; margin-top: 10px; opacity: .85; }
    @keyframes gira { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="girar"><div class="tel">📱</div><b>Gire o celular</b><span>O jogo é na horizontal. Vire o aparelho para jogar!</span></div>

  <!-- Phaser fica dentro da pasta lib/: o jogo funciona sem internet -->
  <script src="lib/phaser.min.js"></script>
  <script src="src/phaser-fix.js"></script>
  <script src="src/config.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/music.js"></script>
  <script src="src/achievements.js"></script>
  <script src="src/shop.js"></script>
  <script src="src/rankglobal.js"></script>
  <script src="src/levels.js"></script>
  <script src="src/scenery.js"></script>
  <script src="src/estados.js"></script>
  <script src="src/textures.js"></script>
  <script src="src/scenes/Boot.js"></script>
  <script src="src/scenes/Menu.js"></script>
  <script src="src/scenes/Intro.js"></script>
  <script src="src/scenes/Ending.js"></script>
  <script src="src/scenes/Credits.js"></script>
  <script src="src/scenes/Game.js"></script>
  <script src="src/boss.js"></script>
  <script src="src/scenes/Pause.js"></script>
  <script src="src/scenes/End.js"></script>
  <script src="src/scenes/GameOver.js"></script>
  <script src="src/scenes/Options.js"></script>
  <script src="src/scenes/Voice.js"></script>
  <script src="src/scenes/Wardrobe.js"></script>
  <script src="src/scenes/Centro.js"></script>
  <script src="src/scenes/Shop.js"></script>
  <script src="src/scenes/Rank.js"></script>
  <script src="src/scenes/Toast.js"></script>
  <script src="src/gamepad.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
